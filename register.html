<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie sua conta na Banca Compartilhada.">
    <meta name="color-scheme" content="dark">
    <title>Criar Conta · Banca Compartilhada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <div class="logo-ring">
                <img src="logo.png" alt="Banca Compartilhada" class="logo-ring__img">
            </div>
            <span class="eyebrow">Banca Compartilhada</span>
            <h2>Criar conta</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <div class="input-wrapper">
                        <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Seu nome"
                            autocomplete="name"
                            required
                        >
                    </div>
                </div>
                <div class="input-group">
                    <label for="emailReg">E-mail</label>
                    <div class="input-wrapper">
                        <input
                            type="email"
                            id="emailReg"
                            name="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            inputmode="email"
                            required
                        >
                    </div>
                </div>
                <div class="input-group">
                    <label for="senhaReg">Senha</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="senhaReg"
                            name="senha"
                            placeholder="Mínimo de 6 caracteres"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                        <button type="button" class="toggle-senha" data-alvo="senhaReg" aria-label="Mostrar senha">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <input type="hidden" id="refIndicador" name="refIndicador" value="">
                <p id="avisoIndicacao" class="modal-lead" style="display: none; color: var(--primary); text-align: center; margin-bottom: 15px;">
                    🎉 Você foi indicado por um amigo!
                </p>
                <button type="submit" class="btn">Cadastrar</button>
            </form>
            <p class="link-text">Já possui conta? <a href="login.html">Faça login</a></p>
        </div>
    </main>
    <!-- Bolha flutuante: baixar o aplicativo (some dentro do app e no iPhone) -->
    <a
        href="https://github.com/lucas-programador-lang/Banca-Compartilhada/releases/latest/download/banca-compartilhada.apk"
        class="app-download-fab"
        id="baixarAppBox"
        download="banca-compartilhada.apk"
        rel="noopener"
        aria-label="Baixar o aplicativo Banca Compartilhada para Android"
    >
        <span class="app-download-fab__label">Baixar app</span>
        <span class="app-download-fab__bubble">
            <img src="logo.png" alt="" class="app-download-fab__logo">
            <span class="app-download-fab__badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>
            </span>
        </span>
    </a>

    <!-- Esconde a bolha dentro do próprio app e no iPhone (o APK só funciona no Android) -->
    <script>
        (function () {
            var box = document.getElementById('baixarAppBox');
            if (!box) return;
            var dentroDoApp = typeof Android !== 'undefined';
            var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
            if (dentroDoApp || ios) box.style.display = 'none';
        })();
    </script>

    <!-- Script modular do Firebase Auth -->
    <script type="module" src="auth.js"></script>
    <script src="update-modal.js"></script>
</body>
</html>
