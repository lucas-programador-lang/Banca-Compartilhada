<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie sua conta na Banca Compartilhada.">
    <meta name="color-scheme" content="dark">
    <title>Criar Conta · Banca Compartilhada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <span class="eyebrow">Banca Compartilhada</span>
            <h2>Criar conta</h2>

            <form id="registerForm" novalidate>
                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Seu nome"
                            autocomplete="name"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="emailReg">E-mail</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6 12 13 2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
                        <input
                            type="email"
                            id="emailReg"
                            name="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            inputmode="email"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="senhaReg">Senha</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input
                            type="password"
                            id="senhaReg"
                            name="senha"
                            placeholder="Mínimo de 6 caracteres"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                        <button type="button" class="toggle-senha" data-alvo="senhaReg" aria-label="Mostrar senha">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn">Cadastrar</button>
            </form>

            <p class="link-text">Já possui conta? <a href="login.html">Faça login</a></p>
        </div>
    </main>

    <!-- Script modular do Firebase Auth -->
    <script type="module" src="auth.js"></script>
</body>
</html>
