<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Banca Compartilhada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Criar Conta</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Seu nome">
                </div>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="emailReg" required placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="senhaReg" required placeholder="******">
                </div>
                <button type="submit" class="btn">Cadastrar</button>
            </form>
            <p class="link-text">Já possui conta? <a href="login.html">Faça login</a></p>
        </div>
    </div>
    <!-- Script modular do Firebase Auth -->
    <script type="module" src="auth.js"></script>
</body>
</html>
