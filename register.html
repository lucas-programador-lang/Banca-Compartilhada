<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie sua conta na Banca Compartilhada.">
    <meta name="color-scheme" content="dark">
    <title>Criar Conta · Banca Compartilhada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <span class="eyebrow">Banca Compartilhada</span>
            <h2>Criar conta</h2>

            <form id="registerForm" novalidate>
                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Seu nome"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="emailReg">E-mail</label>
                    <input
                        type="email"
                        id="emailReg"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        inputmode="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="senhaReg">Senha</label>
                    <input
                        type="password"
                        id="senhaReg"
                        name="senha"
                        placeholder="Mínimo de 6 caracteres"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="btn">Cadastrar</button>
            </form>

            <p class="link-text">Já possui conta? <a href="login.html">Faça login</a></p>
        </div>
    </main>

    <!-- Script modular do Firebase Auth -->
    <script type="module" src="auth.js"></script>
</body>
</html>
