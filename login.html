<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Banca Compartilhada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Banca Compartilhada</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="senha" required placeholder="******">
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
            <p class="link-text">Não tem uma conta? <a href="register.html">Cadastre-se</a></p>
        </div>
    </div>
    <!-- Script de Integração Firebase (Adicionar SDKs aqui se necessário) -->
    <script src="script.js"></script>
</body>
</html>
