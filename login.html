<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse sua conta na Banca Compartilhada.">
    <meta name="color-scheme" content="dark">
    <title>Entrar · Banca Compartilhada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <span class="eyebrow">Bem-vindo de volta</span>
            <h2>Banca Compartilhada</h2>

            <form id="loginForm" novalidate>
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        inputmode="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn">Entrar</button>
            </form>

            <p class="link-text">Não tem uma conta? <a href="register.html">Cadastre-se</a></p>
        </div>
    </main>

    <!-- Script modular do Firebase Auth -->
    <script type="module" src="auth.js"></script>
</body>
</html>
