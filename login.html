<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse sua conta na Banca Compartilhada.">
    <meta name="color-scheme" content="dark">
    <title>Entrar · Banca Compartilhada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <span class="eyebrow">Bem-vindo de volta</span>
            <h2>Banca Compartilhada</h2>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            inputmode="email"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Sua senha"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-senha" data-alvo="senha" aria-label="Mostrar senha">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn">Entrar</button>
            </form>

            <p class="link-text secondary"><a href="#" id="esqueciSenha">Esqueceu sua senha?</a></p>
            <p class="link-text">Não tem uma conta? <a href="register.html">Cadastre-se</a></p>
        </div>
    </main>

    <!-- Script modular do Firebase Auth -->
    <script type="module" src="auth.js"></script>
</body>
</html>
